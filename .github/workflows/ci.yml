name: Fleet Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t tobeynd/fleet-management:latest .

      - name: Push to Docker Hub
        run: docker push tobeynd/fleet-management:latest

  deploy:
    runs-on: ubuntu-latest
    needs: publish_images
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Deploy to EC2 instances via SSM
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tobeynd_fleet_app" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["sudo docker pull tobeynd/fleet-management:latest","sudo docker stop fleet-app || true","sudo docker rm fleet-app || true","sudo docker run -d --name fleet-app -p 3002:3002 -e DB_HOST=${{ secrets.DB_HOST }} -e DB_PORT=5432 -e DB_USER=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e DB_NAME=${{ secrets.DB_NAME }} tobeynd/fleet-management:latest"]' \
              --comment "Deploy latest fleet-management image"
          done
          
      - name: Blue/Green Switch
        run: |
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn $(aws elbv2 describe-load-balancers --names tobeynd-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text --region af-south-1) \
            --query 'Listeners[0].ListenerArn' \
            --region af-south-1 \
            --output text)

          CURRENT_TG=$(aws elbv2 describe-listeners \
            --load-balancer-arn $(aws elbv2 describe-load-balancers --names tobeynd-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text --region af-south-1) \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --region af-south-1 \
            --output text)

          BLUE_TG_ARN=$(aws elbv2 describe-target-groups --names tobeynd-tg-blue --query 'TargetGroups[0].TargetGroupArn' --output text --region af-south-1)
          GREEN_TG_ARN=$(aws elbv2 describe-target-groups --names tobeynd-tg-green --query 'TargetGroups[0].TargetGroupArn' --output text --region af-south-1)

          if [ "$CURRENT_TG" == "$BLUE_TG_ARN" ]; then
            NEW_TG=$GREEN_TG_ARN
            echo "Switching from Blue to Green"
          else
            NEW_TG=$BLUE_TG_ARN
            echo "Switching from Green to Blue"
          fi

          aws elbv2 modify-listener \
            --listener-arn $LISTENER_ARN \
            --default-actions Type=forward,TargetGroupArn=$NEW_TG \
            --region af-south-1

          echo "Traffic switched successfully!"


  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
