name: Fleet Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t tobeynd/fleet-management:latest .

      - name: Push to Docker Hub
        run: docker push tobeynd/fleet-management:latest

  deploy:
    runs-on: ubuntu-latest
    needs: publish_images
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Get EC2 Instance IDs
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=tobeynd_fleet_app" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "Found instances: $INSTANCE_IDS"

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instance_ids }}"
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying to $INSTANCE_ID..."
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands='[
                "sudo docker pull tobeynd/fleet-management:latest",
                "sudo docker stop fleet-app || true",
                "sudo docker rm fleet-app || true",
                "sudo docker run -d --name fleet-app -p 3002:3002 -e DB_HOST='"${{ secrets.DB_HOST }}"' -e DB_PORT=5432 -e DB_USER='"${{ secrets.DB_USERNAME }}"' -e DB_PASSWORD='"${{ secrets.DB_PASSWORD }}"' -e DB_NAME='"${{ secrets.DB_NAME }}"' tobeynd/fleet-management:latest"
              ]' \
              --comment "Deploy latest fleet-management image" \
              --output text
            echo "Command sent to $INSTANCE_ID"
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform/environments/dev
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
