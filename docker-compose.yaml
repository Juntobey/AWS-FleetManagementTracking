version: "3.8"
services:
  app:
    build: .
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=HewCharaSaw@&2410
      - DB_NAME=fleet_management

  db:
    image: postgres:16
    container_name: fleet_management_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=HewCharaSaw@&2410
      - POSTGRES_DB=fleet_management
    volumes:
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
